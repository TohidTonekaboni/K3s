name: Capstone CI

on:
  push:
    branches: [main]
    paths:
      - "Capstone_Project/app/**"
      - "Capstone_Project/Dockerfile"
      - ".github/workflows/capstone-ci.yml"
  pull_request:
    paths:
      - "Capstone_Project/app/**"
      - "Capstone_Project/Dockerfile"
      - ".github/workflows/capstone-ci.yml"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/k3s-capstone-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Capstone_Project/app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: Capstone_Project/app
        run: pytest -q

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: Capstone_Project
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
